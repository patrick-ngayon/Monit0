
<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>MONITORING WORLDL CHECK</title>
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
        }
        .monitoring-container {
            background-color: #e8e8e8;
            border: 1px solid #999;
            width: 400px;
            padding: 0;
        }
        .header-row {
            display: flex;
            align-items: center;
            background-color: #e8e8e8;
            padding: 8px 12px;
            border-bottom: 1px solid #999;
            font-weight: bold;
            font-size: 14px;
        }
        .header-title {
            flex: 1;
            color: #333;
        }
        .status-ok {
            background-color: #4CAF50;
            color: white;
            padding: 2px 8px;
            margin: 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        .timestamp {
            color: #333;
            font-size: 12px;
            font-weight: normal;
        }
        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        .metrics-table td {
            border: 1px solid #999;
            padding: 8px 12px;
            font-size: 14px;
        }
        .metric-label {
            background-color: #f0f0f0;
            color: #333;
            width: 60%;
        }
        .metric-value {
            background-color: white;
            color: #333;
            text-align: left;
            width: 40%;
        }
</style>
</head><body>
<div class='monitoring-container'>
<div class='header-row'>
<span class='header-title'>MONITORING WORLDL CHECK</span>
<span class='status-ok'>OK</span>
<span class='timestamp'>24/07/2025 10:50:04</span>
</div>
<table class='metrics-table'>
<tr>
<td class='metric-label'>Nombre de lignes traitées</td>
<td class='metric-value'>1375</td>
</tr>
<tr>
<td class='metric-label'>Nombre d'erreurs</td>
<td class='metric-value'>0</td>
</tr>
<tr>
<td class='metric-label'>Pourcentage erreurs</td>
<td class='metric-value'>0%</td>
</tr>
</table>
</div></body></html>
